name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate contract types
        run: npm run contracts:generate

      - name: Verify generated files are current
        run: git diff --exit-code

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  api:
    name: API Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r apps/api/requirements-dev.txt

      - name: Lint
        run: ruff check apps/api

      - name: Typecheck
        run: mypy apps/api/src --config-file apps/api/pyproject.toml

      - name: Test
        run: SUPABASE_URL="https://mock.supabase.co" SUPABASE_SERVICE_ROLE_KEY="mock-key" python -m unittest discover -s apps/api/tests