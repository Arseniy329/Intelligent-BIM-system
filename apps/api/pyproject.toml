[project]
name = "intelligent-bim-api"
version = "0.1.0"
description = "FastAPI backend for the Intelligent BIM system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "supabase",
    "ezdxf",
    "shapely",
    "datamodel-code-generator",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"api/index.py" = ["E402"]
"tests/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "src.contracts.generated"
ignore_errors = true
